services:
  lang2pose:
    container_name: lang2pose
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: lang2pose:latest
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    tty: true
    stdin_open: true
    env_file:
      - path: resources/llmagent/.env   # OPENROUTER_API_KEY
        required: false
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      # 켤 확장 (공백 구분). /extensions 아래에 마운트한 확장 이름을 추가
      - ENABLE_EXTS=aisl.robrain.extension
    volumes:
      # 확장: /extensions/<확장 이름> 으로 마운트하면 Isaac Sim이 자동으로 찾음
      - ./resources/extensions/aisl.robrain.extension:/extensions/aisl.robrain.extension
      - ./resources/extensions/lang2pose:/isaac-sim/exts/omni.isaac.examples/omni/isaac/examples/lang2pose
      - ./resources/assets:/root/Documents/assets
      # GUI / 오디오
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/root/.Xauthority
      - ${XDG_RUNTIME_DIR}/pulse/native:/run/user/1000/pulse/native
      - $HOME/.config/pulse/cookie:/root/.config/pulse/cookie:ro
      # 캐시 (셰이더 등, 재시작 속도용)
      - ./workspace/cache/kit:/isaac-sim/kit/cache
      - ./workspace/cache/ov:/root/.cache/ov
      - ./workspace/cache/glcache:/root/.cache/nvidia/GLCache
      - ./workspace/cache/computecache:/root/.nv/ComputeCache
      - ./workspace/logs:/root/.nvidia-omniverse/logs
      - ./workspace/data:/root/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # FoundationPose 6D 자세 추정: 카메라 토픽 -> /object_marker_array
  perception:
    container_name: lang2pose_perception
    image: foundationpose:metacom
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/lang2pose/fastdds.xml
    volumes:
      - ./fastdds_config/fastdds.xml:/etc/lang2pose/fastdds.xml:ro
      - ./resources/perception/lang2pose_perception:/ros2_ws/src/lang2pose_perception:ro
      # FoundationPose 가중치와 YCB 메시 (FOUNDATIONPOSE_DATA로 경로 변경 가능)
      - ${FOUNDATIONPOSE_DATA:-../metacom-foundationpose}/weights:/FoundationPose/weights:ro
      - ${FOUNDATIONPOSE_DATA:-../metacom-foundationpose}/demo_data/ycb:/FoundationPose/demo_data/ycb:ro
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               cd /ros2_ws && colcon build --packages-select lang2pose_perception &&
               source install/setup.bash &&
               ros2 run lang2pose_perception pose_estimator"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
